<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f4f0" />
    <title>steps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="wordmark" href="#home" aria-label="steps home">steps</a>
        <nav class="navigation" aria-label="Main navigation">
          <a class="nav-link is-active" href="#home" aria-current="page">Home</a>
          <a class="nav-link" href="#track">Track</a>
        </nav>
        <div class="profile-avatar" role="img" aria-label="Profile picture">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <defs>
              <linearGradient id="avatar-bg" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0" stop-color="#d8c6a9" />
                <stop offset="1" stop-color="#a8ad91" />
              </linearGradient>
            </defs>
            <circle cx="20" cy="20" r="20" fill="url(#avatar-bg)" />
            <path d="M7 39c1.3-7.5 6-11.2 13-11.2S31.7 31.5 33 39" fill="#56604c" />
            <path d="M12.1 16.4c0-6 3.2-9.4 8.1-9.4s7.8 3.4 7.8 9.4v2.5c0 5.2-3.1 9.3-7.8 9.3s-8.1-4.1-8.1-9.3z" fill="#bd8469" />
            <path d="M11.5 17c-.7-7.5 3.1-11.2 8.9-11.2 5.1 0 8.5 3 8.1 8.4-2.2-1.1-3.8-3.2-4.4-5.3-2.3 2.8-6.7 4.5-12.6 4.6z" fill="#343a32" />
            <path d="M15.5 18.6h.1m8.7 0h.1" stroke="#343a32" stroke-linecap="round" stroke-width="1.5" />
            <path d="M17.3 23.2c1.5 1.1 3.8 1.1 5.3 0" fill="none" stroke="#805643" stroke-linecap="round" stroke-width="1.2" />
          </svg>
        </div>
      </header>

      <main>
        <section class="home-screen" id="home" aria-label="Home">
          <div class="hero-content">
            <h1 class="hero-title">steps</h1>
            <a class="track-button" href="#track">
              <span>Track</span>
              <span class="button-arrow" aria-hidden="true">→</span>
            </a>
          </div>
        </section>

        <section class="track-screen" id="track" aria-label="Step tracker" hidden>
          <div class="tracker-card">
            <div class="session-total">
              <span class="session-label">Steps today</span>
              <output class="session-count" aria-label="Steps logged today" aria-live="off">0</output>
            </div>
            <form class="log-form">
              <label class="minute-field">
                <span class="minute-label">Minutes</span>
                <span class="minute-input-wrap">
                  <input
                    class="minute-input"
                    name="minutes"
                    type="number"
                    min="0.01"
                    step="any"
                    inputmode="decimal"
                    placeholder="0"
                    required
                  />
                  <span class="minute-unit">min</span>
                </span>
              </label>
              <button class="log-button" type="submit">
                <span>Log minutes</span>
                <span class="button-arrow" aria-hidden="true">→</span>
              </button>
              <p class="log-status" role="status" aria-live="polite"></p>
            </form>
            <section class="steps-log" aria-label="Steps log">
              <h2 class="steps-log-heading">Steps log</h2>
              <div class="steps-log-list"></div>
            </section>
          </div>
        </section>
      </main>
      <footer class="total-bar" hidden>
        <div class="total-summary">
          <span class="total-label">All-time steps</span>
          <output class="total-count" aria-label="All-time steps" aria-live="off">0</output>
        </div>
        <button class="complete-day-button" type="button">Complete day</button>
      </footer>
    </div>
  </body>
</html>
